media:
  input: public/images/dicas
  output: /images/dicas

content:
  - name: dicas
    label: 5 de sexta
    type: collection
    path: src/content/dicas
    filename: "{fields.data}.md"
    view:
      fields: [edicao, data, titulo]
      primary: titulo
      sort: [data, edicao]
      default:
        sort: data
        order: desc
    fields:
      - name: edicao
        label: Edição (#)
        type: number
        required: true
      - name: data
        label: Data da sexta-feira
        type: date
        required: true
      - name: titulo
        label: Tema da semana (opcional)
        type: string
      - name: dicas
        label: As 5 dicas
        type: object
        list:
          min: 1
          max: 5
        fields:
          - name: tipo
            label: Categoria
            type: select
            required: true
            options:
              values:
                - livro
                - filme
                - serie
                - musica
                - artigo
                - video
                - ferramenta
                - outro
          - name: titulo
            label: Título
            type: string
            required: true
          - name: imagem
            label: Imagem / Capa (opcional)
            type: image
          - name: imagemAlt
            label: Descrição da imagem (alt)
            type: string
          - name: nota
            label: Comentário / Nota
            type: text
          - name: citacao
            label: Citação (opcional)
            type: text
          - name: citacaoFonte
            label: Autor / Fonte da citação (opcional)
            type: string
          - name: link
            label: Link externo (opcional)
            type: string

